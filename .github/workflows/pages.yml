name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Upload and deploy GitHub Pages"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      run_ai:
        description: "Run optional AI sidecar generation for opted-in DOCX files"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      ai_provider:
        description: "AI provider for prepare-ai"
        required: false
        default: "mock"
        type: choice
        options: ["mock", "openai", "gemini"]
      force_ai:
        description: "Overwrite existing generated AI sidecars"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      run_3d:
        description: "Run optional paid 3D generation for opted-in DOCX files"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      model_provider:
        description: "3D provider for prepare-3d"
        required: false
        default: "mock"
        type: choice
        options: ["mock", "meshy", "tripo"]
      model_input:
        description: "3D generation input"
        required: false
        default: "text"
        type: choice
        options: ["text", "image"]
      force_3d:
        description: "Overwrite current generated 3D outputs"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-docker-action@0234bb73ccb40f0c430b795634f9247e2b5c2d23 # v5.2.0
        with:
          version: v29.5.2
      - run: npm ci
      - run: npm run homebrewery:image
      - run: npm run check
      - run: npm run build
      - name: Prepare AI sidecars
        if: ${{ inputs.run_ai == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_ai }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          node build/src/cli/index.js prepare-ai characters --provider "${{ inputs.ai_provider }}" $FORCE_FLAG
      - name: Prepare 3D assets
        if: ${{ inputs.run_3d == 'true' }}
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_3d }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          node build/src/cli/index.js prepare-3d characters --provider "${{ inputs.model_provider }}" --input "${{ inputs.model_input }}" $FORCE_FLAG
      - run: node build/src/cli/index.js build-site --input characters --out dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: ${{ inputs.publish_pages == 'true' || vars.PUBLISH_PAGES == 'true' }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: ${{ inputs.publish_pages == 'true' || vars.PUBLISH_PAGES == 'true' }}
        with:
          path: dist

  deploy:
    if: ${{ inputs.publish_pages == 'true' || vars.PUBLISH_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
